[project]
name = "hotel-project"
version = "0.6.0"
requires-python = ">=3.12,<3.13"
description = "Local-first hotel distribution platform, G4 local AI and bounded policy automation"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".runtime", "apps/admin/node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
